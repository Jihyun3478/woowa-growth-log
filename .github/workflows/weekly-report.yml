name: Weekly Growth Report

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      report_date:
        description: "리포트 날짜 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.NIM_API_KEY }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: python .github/scripts/generate_report.py weekly

      - name: Commit and push reports
        run: |
          git config user.name "growth-bot"
          git config user.email "growth-bot@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "chore: weekly report $(date +'%Y-W%V')"
          git push
